# gt8pro_touch v3.0 legacy 后端配置（仅 ColorOS 12~16 老平台需要）
#
# 背景：ColorOS 12~16 的触控栈提供 /odm/bin/touchHidlTest 下发采样率，该通道在
#       老平台是**有效**的；ColorOS 17 更换了实现（本机 RMX5200 已无此文件），
#       新平台改走 hbp / proc_rate 等后端（守护进程用 --probe 自动探测）。
#
# 本文件只在守护进程探测到 /odm/bin/touchHidlTest 时才会被读取，且必须 enabled=1 才生效。
# 命令按机型自填（不同机型/一代的 touchHidlTest 参数不同，本模块不内置未验证命令）。
#
# 格式：键=值（key=value）。可用键（按 Hz 设置对应命令）：
#   set_120=<命令>、set_180=、set_240=、set_288=、set_360=、set_400=
#   restore=<命令>        恢复默认档（强烈建议填写；守护进程退出时使用）
#   enabled=0             0=禁用（默认）；1=启用本通道下发
#
# 命令通过 sh -c 执行，可用 ; && 串联，也可写完整路径 + 参数。
# 例（一加12 PJD110 旧模块写法，未在本模块验证，仅供参考，请按自己机型/系统实测后填写）：
#   set_360=/odm/bin/touchHidlTest -c wo 0 26 12c
#   restore=/odm/bin/touchHidlTest -c wo 0 26 c
#
# 安全要求：
#   - 未验证前保持 enabled=0，否则可能写入错误值（老平台写错协议可能卡顿/无触控）
#   - 每次实验后用 restore 命令恢复默认档
#   - 本文件不是 ColorOS 17 用的，ColorOS 17/新平台请忽略本文件

enabled=0

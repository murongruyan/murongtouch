# gt8pro_touch v3.0 守护进程运行参数（可选）
#
# 说明：
#   - 键=值 格式（key=value，不支持 export/引号/空格）
#   - # 开头为注释，空行忽略
#   - 【采样率规则请改 config/采样率.txt】（第一行全局 Hz + 每行“包名 采样率”），
#     本文件只放守护进程行为参数；改本文件后需重启守护进程，采样率.txt 支持热更新
#   - v3 守护进程支持 SIGHUP 重载配置（WebUI 保存后会发送）

# 后端选择：auto = 启动时自动探测（推荐）
#   可选：auto | hbp | proc_rate | white_list | legacy
#   - hbp         ：RMX5200 等 HBP 架构（复制 touchDaemon 的 /dev/tcm_hbp0 fd + ioctl）
#   - proc_rate   ：多数 ColorOS 17 oplus_touchscreen_v2 机型（/proc/touchpanel/report_rate）
#   - white_list  ：/proc/touchpanel/rate_white_list 备用通道
#   - legacy      ：ColorOS 12~16 的 /odm/bin/touchHidlTest 通道，命令需在 config/legacy.conf 自填
backend=auto

# 前台检测轮询间隔（秒），建议 1~2；越小越灵敏、越费电
poll_interval=1

# 日志大小上限（KB），超过后守护进程把 config/daemon.log 轮转为 daemon.log.1
log_max_kb=256

# ---------------------------------------------------------------------------
# 兼容 v2 旧配置（仅当 config/采样率.txt 不存在时使用；建议尽快改写成新格式）
# ---------------------------------------------------------------------------
# 旧白名单应用命中时下发的 code：1 = 360Hz
set_code=1
# 兜底恢复 code：2 = 120Hz（守护进程正常退出时恢复的是启动时动态捕获的原值）
restore_code=2
# 兼容旧版脚本下发方式（0=内置 ioctl，默认；1=exec set_rate.sh/restore_rate.sh 调试用）
use_script=0

# ---------------------------------------------------------------------------
# DC_SET_REPORT_FRE(0xE6) code ↔ 实测频率（2026-10-23 RMX5200 真机实测，
# 用 /dev/input/event6 的 SYN_REPORT 计数测量；不同机型以 --probe/--get-rate 为准）
# ---------------------------------------------------------------------------
#   1  = 360Hz（实测约 365Hz）—— 官方规格内最高档，模块默认目标
#   2  = 120Hz（实测约 125Hz）—— 本机默认档，守护进程启动时通常会捕获到它
#   3  = 240Hz（实测约 243Hz）—— 官方游戏档，不是默认值
#   4  = 180Hz（实测约 182Hz）
#   5  = 288Hz（实测约 290Hz）
#   8 / 9 / 10 / 12 / 13 / 15 ≈ 385~400Hz（隐藏高阶档，非官方，功耗/稳定性未知，仅尝鲜）
#   0x06 / 0x07 实测异常（掉回 120~155Hz）；0x10 / 0x14 及以上会让触控停止报点，绝对不要写
# --set-rate 的 Hz→code 换算：360→1、120→2、240→3、180→4、288→5、400→9
# 实际当前档位以 `bin/touch_rate_daemon --get-rate` 或 `bin/rate_ctl get` 输出为准

# 被官方 touchDaemon 覆盖后，看门狗两次重写的最小间隔（毫秒）
# 越小抢回越快，但会略微增加耗电；官方只在场景切换瞬间写档位，默认 800 足够
watchdog_min_ms=800

# 轮询间隔（毫秒），默认 1000；越小前台切换响应越快
poll_interval_ms=1000

# 前台检测刷新间隔（毫秒），默认 1000；配合 watchdog_min_ms 可调响应速度
fg_refresh_ms=1000
